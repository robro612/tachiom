[package]
name = "tachiom"
version = "0.3.4"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
python  = ["dep:pyo3", "dep:numpy"]
cli     = ["dep:clap", "dep:anyhow"]
# Optional flat stage timers for PyLate experiment profiling.
# Build with: maturin develop --features python,profile
profile = ["dep:stage-profile"]

[dependencies]
half        = { version = "2.4", features = ["serde", "std", "num-traits"] }
rustc-hash  = "2.1"
serde       = { version = "1.0", features = ["derive"] }
rand        = "0.8"
rayon       = "1.10"
anyhow      = { version = "1.0", optional = true }
clap        = { version = "4.3", features = ["derive"], optional = true }
ndarray     = "0.16"
ndarray-npy = "0.9"
pyo3        = { version = "0.24", features = ["extension-module"], optional = true }
numpy       = { version = "0.24", optional = true, features = ["half"] }
vectorium   = { git = "https://github.com/TusKANNy/vectorium.git", tag = "v0.3.0", features = ["multivec"] }
kannolo     = { git = "https://github.com/TusKANNy/kannolo.git", tag = "v0.6.1" }
stage-profile = { path = "../pylate-pgc/crates/stage-profile", optional = true }

[[bin]]
name = "tachiom_build"
path = "src/bin/tachiom_build.rs"
required-features = ["cli"]

[[bin]]
name = "tachiom_build_from_tac"
path = "src/bin/tachiom_build_from_tac.rs"
required-features = ["cli"]

[[bin]]
name = "tachiom_build_from_parts"
path = "src/bin/tachiom_build_from_parts.rs"
required-features = ["cli"]

[[bin]]
name = "tachiom_search"
path = "src/bin/tachiom_search.rs"
required-features = ["cli"]

[[bin]]
name = "bench_tac"
path = "src/bin/bench_tac.rs"
required-features = ["cli"]

# Local vectorium checkout, for changes to the scoring kernels in
# `multivec_two_level_pq.rs`. A [patch] rather than an edit to the dependency
# line above: it redirects every path to that crate, kannolo's included, so the
# build resolves one vectorium instead of two. The checkout has to stay on a
# commit declaring version 0.3.0 or cargo rejects the patch.
#
# Comment out to build against the upstream tag again.
[patch."https://github.com/TusKANNy/vectorium.git"]
vectorium = { path = "../vectorium" }

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 1
panic = "abort"
strip = "symbols"